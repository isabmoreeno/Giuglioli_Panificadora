services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giuglioli}
      POSTGRES_USER: ${POSTGRES_USER:-giuglioli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - giuglioli_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giuglioli} -d ${POSTGRES_DB:-giuglioli}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  giuglioli_db:
